# Configuração de teste: banco H2 em memória no lugar do MySQL
spring.datasource.url=jdbc:h2:mem:dbacordos;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50

spring.logging.enabled=false

management.endpoints.web.exposure.include=info,health,metrics
management.endpoints.health.probes.enabled=true
